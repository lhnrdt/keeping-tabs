<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-accent="%kt.colors%" style="%kt.own%">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<!-- Installable app (N-3). Its background_color is the dark canvas: Chromium before 156
		     paints the installed app's navigation bar with it, and a bright bar in dark mode is
		     worse than a dark one in light mode -->
		<link
			rel="manifest"
			href="%sveltekit.assets%/manifest.webmanifest"
			crossorigin="use-credentials"
		/>
		<!-- Colors the phone's status and navigation bars; switched with the theme below -->
		<meta name="theme-color" content="#eaf1ec" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Keeping Tabs" />
		<meta name="mobile-web-app-capable" content="yes" />
		<script nonce="%sveltekit.nonce%">
			// Konsta's dark styles hang off a .dark class; set it before first paint, together with
			// the system bars' color (installed apps on Android ignore media on theme-color). The
			// theme is "system" (the device's), "light" or "dark" (a personal setting, in a cookie).
			(() => {
				const query = matchMedia('(prefers-color-scheme: dark)');
				const themeColor = document.querySelector('meta[name="theme-color"]');
				let chosen = /(?:^|; )kt-theme=(light|dark)/.exec(document.cookie)?.[1];
				const apply = () => {
					const dark = chosen ? chosen === 'dark' : query.matches;
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
					// The theme's background (#60), once the styles are there; until then the default's
					const canvas = getComputedStyle(document.documentElement)
						.getPropertyValue(dark ? '--canvas-night' : '--canvas')
						.trim();
					themeColor.content = canvas || (dark ? '#141a16' : '#eaf1ec');
				};
				apply();
				query.addEventListener('change', () => chosen || apply());
				// Settings switch the theme right away, without reloading
				window.applyTheme = (theme) => {
					chosen = theme === 'system' ? undefined : theme;
					apply();
				};
				// The colours (#60, #332) come with the page; settings switch them right away
				// ...or a theme of your own over them (#330), its colours set on the page itself
				let owned = [...document.documentElement.style].filter((name) => name.startsWith('--'));
				window.applyAccent = (accent, own) => {
					const root = document.documentElement;
					root.dataset.accent = accent;
					for (const name of owned) root.style.removeProperty(name);
					owned = Object.keys(own ?? {});
					for (const name of owned) root.style.setProperty(name, own[name]);
					apply();
				};
				// Installing it (#352): the browser's offer comes early, so it's kept for the app's button
				addEventListener('beforeinstallprompt', (event) => {
					event.preventDefault();
					window.installPrompt = event;
					dispatchEvent(new Event('kt-installable'));
				});
				// Which day it is here, for a scenery that changes every day (#332)
				const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
				if (zone && !document.cookie.includes('kt-tz=' + encodeURIComponent(zone))) {
					document.cookie =
						'kt-tz=' + encodeURIComponent(zone) + '; path=/; max-age=31536000; samesite=lax';
				}
				addEventListener('load', apply);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
