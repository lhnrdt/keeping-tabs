<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<!-- Installable app (N-3); colors match the canvas tokens in src/lib/styles/theme.css -->
		<link
			rel="manifest"
			href="%sveltekit.assets%/manifest.webmanifest"
			crossorigin="use-credentials"
		/>
		<!-- Colors the phone's status and navigation bars; switched with the theme below -->
		<meta name="theme-color" content="#f4f1ea" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Keeping Tabs" />
		<meta name="mobile-web-app-capable" content="yes" />
		<script>
			// Konsta's dark styles hang off a .dark class; set it before first paint, together with
			// the system bars' color (installed apps on Android ignore media on theme-color). The
			// theme is "system" (the device's), "light" or "dark" (a personal setting, in a cookie).
			(() => {
				const query = matchMedia('(prefers-color-scheme: dark)');
				const themeColor = document.querySelector('meta[name="theme-color"]');
				const chosen = /(?:^|; )kt-theme=(light|dark)/.exec(document.cookie)?.[1];
				const apply = () => {
					const dark = chosen ? chosen === 'dark' : query.matches;
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
					themeColor.content = dark ? '#1d211d' : '#f4f1ea';
				};
				apply();
				if (!chosen) query.addEventListener('change', apply);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
