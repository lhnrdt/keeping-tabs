<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline – Keeping Tabs</title>
		<style>
			:root { color-scheme: light dark; --canvas: #f4f1ea; --ink: #252822; --muted: #6e7168; }
			@media (prefers-color-scheme: dark) { :root { --canvas: #1d211d; --ink: #ecede8; --muted: #a6a99f; } }
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 2rem; box-sizing: border-box; }
			h1 { font-family: Georgia, serif; font-weight: 600; font-size: 1.75rem; margin: 1rem 0 0.5rem; }
			p { color: var(--muted); max-width: 22rem; margin: 0 auto 1.5rem; }
			a { color: inherit; }
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" width="72" height="72" alt="" />
			<h1>You're offline</h1>
			<p>This page wasn't opened on this device before, so there's no saved copy. Groups you've opened can still be viewed.</p>
			<a href="/">Go to your groups</a>
		</main>
	</body>
</html>
