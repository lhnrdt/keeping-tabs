name: Issue status

# Shows where an issue stands: "status: in review" while a PR for it is open, "status: in
# staging" once it is merged into staging. Issues close (and lose the label) when the
# release PR reaches production, see release-pr.yml.
on:
  pull_request:
    types: [opened, reopened, closed]
    branches: [staging, master]

permissions:
  issues: write
  pull-requests: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Update the labels of the issues this PR is about
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.ref }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          REPO: ${{ github.repository }}
        run: |
          issues=$(printf '%s\n' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|part of) +#[0-9]+' | grep -oE '[0-9]+' | sort -u)
          for issue in $issues; do
            if [ "$ACTION" = closed ] && [ "$MERGED" = true ]; then
              if [ "$BASE" = master ]; then
                # Shipped: GitHub closes the issue, the label is no longer true
                gh issue edit "$issue" --repo "$REPO" --remove-label "status: in staging" || true
              else
                gh issue edit "$issue" --repo "$REPO" --remove-label "status: in review" --add-label "status: in staging" || true
              fi
            elif [ "$ACTION" = closed ]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label "status: in review" || true
            elif [ "$BASE" = staging ]; then
              gh issue edit "$issue" --repo "$REPO" --add-label "status: in review" || true
            fi
          done
