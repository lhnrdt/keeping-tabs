name: Release PR

# After staging deploys, keep one open PR staging → master that ships it.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [staging]

concurrency:
  group: release-pr
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@v5

      - name: Open or update release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/version.ts release HEAD)
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          notes=$(git log --merges --first-parent --format='- %s' "${previous:+$previous..}HEAD")
          body=$(printf 'Ships staging (v%s-rc) to production as **v%s**.\n\n%s\n' "$version" "$version" "$notes")
          existing=$(gh pr list --base master --head staging --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "release: v$version" --body "$body"
          else
            gh pr create --base master --head staging --title "release: v$version" --body "$body"
          fi
