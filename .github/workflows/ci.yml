name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: PR rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@v5

      # The release title ("release: vX.Y.Z") is set by release-pr.yml; checking it here raced
      # with that workflow (a push to staging re-runs this before the title is updated, and
      # the bot's edit can't trigger a new run), so only the branch is checked
      - name: Release PRs go from staging to master
        if: github.event.pull_request.base.ref == 'master'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REF" != staging ]; then
            echo "::error::Only staging can be merged into master (got $HEAD_REF)"
            exit 1
          fi

      - name: Feature PR title is conventional
        if: github.event.pull_request.base.ref != 'master'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/version.ts check-title "$TITLE"

      - name: Commits are single-line and not merges
        if: github.event.pull_request.base.ref != 'master'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list "$BASE..$HEAD"); do
            if [ "$(git rev-list --parents -n 1 "$commit" | wc -w)" -gt 2 ]; then
              echo "::error::$commit is a merge commit; rebase onto the base branch instead"
              status=1
            fi
            if [ -n "$(git log -1 --format=%b "$commit")" ]; then
              echo "::error::$commit has a message body or trailers; commit messages are one line"
              status=1
            fi
          done
          exit $status

  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    # Fail fast instead of GitHub's 6 h default when a step hangs
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - &pnpm-cache
        name: Cache pnpm packages
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities (#140): high and critical ones fail the build
      - name: Dependencies have no serious known vulnerabilities
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm check
      # Unit tests include a browser project, so this job needs Chromium too. The browser is
      # cached per lockfile; the runner image already has Chromium's system libraries
      # (Google Chrome is preinstalled), so no slow apt install (--with-deps)
      - &browser-cache
        name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - &browser-install
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - run: pnpm exec vitest --run

  # Split across parallel runners, so a PR waits about half as long
  e2e:
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - *pnpm-cache
      - run: pnpm install --frozen-lockfile
      - *browser-cache
      - *browser-install
      - run: pnpm db:migrate:local
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

  # The required status check: passes only when both jobs above pass
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: always()
    steps:
      - if: needs.checks.result != 'success' || needs.e2e.result != 'success'
        run: exit 1
      - run: echo "All tests passed"
